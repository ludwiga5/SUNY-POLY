<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 3.2//EN>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex Ludwig</title>
<style>
  :root {
    --ink: #1c1c1a;
    --paper: #faf9f6;
    --line: #d8d5cc;
    --accent: #2f4d3a;
    --muted: #6b675e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    line-height: 1.5;
  }

  header {
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 24px 32px;
    border-bottom: 1px solid var(--line);
  }

  header h1 {
    font-size: 2rem;
    font-weight: normal;
    margin: 0 0 8px;
    letter-spacing: 0.2px;
  }

  header p {
    margin: 0;
    color: var(--muted);
    font-size: 1rem;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  h2 {
    font-size: 1.1rem;
    font-weight: normal;
    text-transform: none;
    margin: 0 0 20px;
    color: var(--ink);
  }

  ul.classes {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  ul.classes li {
    border-bottom: 1px solid var(--line);
  }

  ul.classes li:first-child {
    border-top: 1px solid var(--line);
  }

  ul.classes li a {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 16px 4px;
    text-decoration: none;
    color: var(--ink);
    font-size: 1.05rem;
  }

  ul.classes li a:hover {
    color: var(--accent);
  }

  ul.classes li a .arrow {
    font-family: Arial, sans-serif;
    color: var(--muted);
  }

  .user-badge {
    position: fixed;
    top: 20px;
    right: 24px;
    font-family: Georgia, serif;
    font-size: 0.85rem;
    color: var(--muted);
    text-align: right;
   }

  footer {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px 48px;
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<header>
  <h1>Welcome</h1>
  <h2>Alex Ludwig's Page - Fall 2026</h2>
</header>

<main>
  <h2>Classes</h2>
  <ul class="classes">
    <li>
      <a href="CS330/index.html">
        <span>CS330</span>
        <span class="arrow">&#8594;</span>
      </a>
    </li>
  </ul>
</main>

</body>
<div class="user-badge">
  Alexander Ludwig<br>
  ludwiga
</div>
</html>
